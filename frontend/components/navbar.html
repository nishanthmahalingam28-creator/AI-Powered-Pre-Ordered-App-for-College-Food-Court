<header class="bg-gradient-to-r from-[#071638] via-[#113377] to-[#0b245c] border-b border-white/10 sticky top-0 z-50 shadow-[0_10px_30px_rgba(7,22,56,0.5)] backdrop-blur-md">
        <!-- Thin neon top highlight bar -->
        <div class="h-[2px] w-full bg-gradient-to-r from-teal-500 via-cyan-400 to-emerald-400"></div>

        <div class="max-w-[1500px] mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-4">
            <!-- Left Area: Large Brand Logo Graphic Card with AI Status Pulsar -->
            <a data-site-path="index.html" href="index.html" class="flex items-center shrink-0 relative group">
                <div class="bg-white p-2 rounded-xl shadow-[0_4px_20px_rgba(255,255,255,0.1)] border border-white/20 flex items-center justify-center transition-all duration-300 group-hover:shadow-[0_4px_25px_rgba(45,212,191,0.3)] group-hover:scale-[1.02]">
                    <img data-site-path="assets/logo/kpriet-logo.jpg" src="assets/logo/kpriet-logo.jpg" alt="KPR Logo" class="h-10 xs:h-12 sm:h-14 md:h-16 w-auto object-contain" onerror="this.src='https://placehold.co/180x50/ffffff/113377?text=KPR+Logo'">
                </div>

                <!-- Campus Sub-branding Labels (Tablet & Desktop: md:block) -->
                <div class="hidden md:block border-l border-white/20 pl-4 ml-3 relative">
                    <span class="absolute -top-1 -right-3 flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-teal-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-teal-400"></span>
                    </span>
                    <span class="block text-xs font-black text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-cyan-300 uppercase tracking-widest leading-tight drop-shadow-[0_2px_10px_rgba(45,212,191,0.3)]">Campus Dining</span>
                    <span class="block text-[10px] text-slate-300 font-medium mt-1 leading-none tracking-wide">Smart Pre-Order</span>
                </div>
            </a>

            <!-- Center Area: Mobile & Tablet Layout Search (Hidden on Laptop: lg:hidden) -->
            <div class="flex-1 max-w-md mx-2 sm:mx-4 lg:hidden">
                <form data-site-path="search.html" action="search.html" method="GET" class="relative group">
                    <div class="absolute -inset-0.5 bg-gradient-to-r from-teal-400 via-cyan-400 to-emerald-400 rounded-2xl opacity-20 group-focus-within:opacity-100 blur-sm group-focus-within:blur transition duration-500 pointer-events-none"></div>
                    <div class="relative flex items-center">
                        <input
                            type="text"
                            name="q"
                            placeholder="Search dishes, stalls..."
                            class="w-full bg-slate-950/60 border border-white/10 rounded-2xl pl-11 pr-4 py-3 text-xs sm:text-sm text-white placeholder-slate-400/70 focus:outline-none focus:bg-slate-950/90 shadow-[inset_0_4px_12px_rgba(0,0,0,0.6)] transition-all duration-300 tracking-wide"
                        >
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="h-4 w-4 text-slate-400 group-focus-within:text-teal-400 transform group-focus-within:scale-110 transition-all duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Center Area: Laptop/Desktop Navigation Menu Bar (Visible only on Laptop: hidden lg:flex) -->
            <nav class="hidden lg:flex items-center gap-1.5 bg-slate-950/40 border border-white/10 rounded-full p-1.5 backdrop-blur-md shadow-[inset_0_2px_8px_rgba(0,0,0,0.4)] mx-auto">
                <a data-site-path="index.html" href="index.html" class="relative text-xs font-black text-slate-950 bg-gradient-to-r from-teal-400 via-cyan-400 to-emerald-400 px-6 py-2.5 rounded-full shadow-[0_4px_15px_rgba(45,212,191,0.4)] transition-all duration-300 whitespace-nowrap tracking-wider uppercase">
                    Home
                </a>
                <a data-site-path="pages/public/about.html" href="pages/public/about.html" class="text-xs font-bold text-slate-300 hover:text-teal-400 px-5 py-2.5 rounded-full hover:bg-white/5 transition-all duration-300 whitespace-nowrap tracking-wider uppercase">
                    About
                </a>
                <a data-site-path="pages/public/how-it-works.html" href="pages/public/how-it-works.html" class="text-xs font-bold text-slate-300 hover:text-teal-400 px-5 py-2.5 rounded-full hover:bg-white/5 transition-all duration-300 whitespace-nowrap tracking-wider uppercase">
                    How It Works
                </a>
                <a data-site-path="pages/public/contact.html" href="pages/public/contact.html" class="text-xs font-bold text-slate-300 hover:text-teal-400 px-5 py-2.5 rounded-full hover:bg-white/5 transition-all duration-300 whitespace-nowrap tracking-wider uppercase">
                    Contact
                </a>
            </nav>

            <!-- Right Area: General Customer Portal Access -->
            <div class="shrink-0">
                <!-- Laptop / Desktop Button (hidden lg:flex) -->
                <a data-site-path="pages/auth/login.html" href="pages/auth/login.html" class="hidden lg:flex items-center gap-2.5 bg-gradient-to-r from-teal-500 via-[#008080] to-[#33AA44] text-white font-black text-xs uppercase tracking-wider px-7 py-3.5 rounded-xl shadow-[0_4px_20px_rgba(0,128,128,0.3)] hover:shadow-[0_6px_25px_rgba(51,170,68,0.4)] hover:opacity-95 transform hover:-translate-y-0.5 transition-all duration-300 border border-white/10">
                    <span>Login</span>
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                    </svg>
                </a>

                <!-- Mobile & Tablet Button (lg:hidden) -->
                <a data-site-path="pages/auth/login.html" href="pages/auth/login.html" class="lg:hidden flex items-center gap-1.5 bg-gradient-to-r from-teal-400 via-cyan-400 to-emerald-400 text-slate-950 rounded-xl px-4 py-2.5 text-xs font-black tracking-wider uppercase shadow-[0_4px_15px_rgba(45,212,191,0.4)] active:scale-95 transition-all border border-white/20">
                    <svg class="w-3.5 h-3.5 text-slate-950 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14"></path>
                    </svg>
                    <span>Login</span>
                </a>
            </div>
        </div>
    </header>
