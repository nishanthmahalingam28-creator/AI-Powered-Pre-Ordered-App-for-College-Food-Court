<!-- Shared Vendor Notifications Drawer -->
<div id="vendor-notif-backdrop" class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-[70] hidden" onclick="toggleVendorNotifDrawer(false)"></div>
<aside id="vendor-notif-drawer" class="fixed top-0 right-0 h-full w-full sm:w-96 bg-white z-[80] shadow-2xl translate-x-full transition-transform duration-300 ease-in-out flex flex-col border-l border-slate-200" aria-label="Vendor notifications">
  <div class="p-5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center text-sm font-black"><i class="fa-solid fa-bell"></i></div>
      <div><h3 class="text-sm font-black text-slate-900">Kitchen Alerts</h3><p class="text-[10px] text-slate-400">Incoming orders & kitchen events</p></div>
    </div>
    <div class="flex items-center gap-2">
      <button type="button" onclick="markAllVendorNotifsRead()" class="text-[11px] font-bold text-blue-700 hover:underline px-2 py-1">Mark all read</button>
      <button type="button" onclick="toggleVendorNotifDrawer(false)" class="w-8 h-8 rounded-xl hover:bg-slate-200/60 text-slate-400 hover:text-slate-700 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </div>
  <div id="vendor-notif-items" class="flex-grow overflow-y-auto p-4 space-y-3"></div>
  <div class="p-3 border-t border-slate-100 text-center bg-slate-50 text-[10px] text-slate-400">Live notification updates</div>
</aside>
