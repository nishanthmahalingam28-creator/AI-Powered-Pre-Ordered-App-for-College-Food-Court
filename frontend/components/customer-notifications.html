<!-- Shared Customer Notification Center: used on every customer dashboard page -->
<div id="notification-backdrop" class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-50 hidden transition-opacity"></div>
<div id="notification-drawer" class="fixed top-0 right-0 h-full w-full sm:w-96 bg-white z-50 shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col border-l border-slate-200">
  <div class="p-5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-teal-50 text-teal-700 flex items-center justify-center text-sm font-black"><i class="fa-solid fa-bell"></i></div>
      <div><h3 class="text-sm font-black text-slate-900">Notifications</h3><p class="text-[10px] text-slate-400">Live order & payment alerts</p></div>
    </div>
    <div class="flex items-center gap-2">
      <button id="notif-mark-all-btn" class="text-[11px] font-bold text-teal-700 hover:text-teal-800 hover:underline px-2 py-1" title="Mark all read">Mark all read</button>
      <button id="close-notif-drawer-btn" class="w-8 h-8 rounded-xl hover:bg-slate-200/60 text-slate-400 hover:text-slate-700 flex items-center justify-center transition-colors"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </div>
  <div id="notification-items-container" class="flex-grow overflow-y-auto p-4 space-y-3"></div>
  <div class="p-3 border-t border-slate-100 text-center bg-slate-50 text-[10px] text-slate-400">Updates refresh automatically every 30 seconds while this page is visible.</div>
</div>
