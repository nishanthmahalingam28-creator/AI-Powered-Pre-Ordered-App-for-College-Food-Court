<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Login | KPR Food Court</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../js/core/tailwind-config.js"></script>

    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../css/components/common.css">
    <script src="../../js/core/public-components.js" defer></script>
    <link rel="stylesheet" href="../../css/pages/guest-auth.css">
</head>
<body class="bg-kpr-lightBg min-h-screen flex flex-col justify-between font-sans overflow-x-hidden">

    <!-- Header Branding -->
    <!-- Header Section -->
    <div id="navbar-container"></div>
    <!-- Main Content Container -->
    <main class="flex-grow flex items-center justify-center px-4 sm:px-6 lg:px-8 py-10">
        <div class="max-w-md w-full bg-white rounded-[24px] shadow-xl border border-gray-100 p-8 border-t-[6px] border-t-kpr-teal">

            <!-- Icon & Page Header -->
            <div class="flex flex-col items-center mb-6">
                <div class="w-16 h-16 bg-[#e6f2f2] rounded-full flex items-center justify-center mb-3">
                    <svg class="w-8 h-8 text-kpr-teal" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                </div>
                <h2 class="text-2xl font-extrabold text-gray-900 tracking-tight">Welcome Guest</h2>
                <p class="text-sm text-gray-500 mt-1">Sign in to order food from the campus court</p>
            </div>



            <!-- Login Form -->
            <form id="guestLoginForm" class="space-y-4">

                <!-- Email/Phone Input -->
                <div>
                    <label for="email" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Email / Phone</label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            &#128231;
                        </div>
                        <input type="text" id="email" required placeholder="yourname@email.com or Mobile"
                            class="block w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-kpr-teal focus:border-kpr-teal outline-none transition-all text-sm text-gray-900">
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <label for="password" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Password</label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            &#128274;
                        </div>
                        <input type="password" id="password" required placeholder="••••••••"
                            class="block w-full pl-10 pr-12 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-kpr-teal focus:border-kpr-teal outline-none transition-all text-sm text-gray-900">
                        <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition-colors">
                            &#128065;
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-kpr-teal hover:bg-[#006666] text-white font-semibold py-3 px-6 rounded-xl flex items-center justify-center gap-2 transition-all shadow-md mt-4">
                    Sign In <span class="text-lg font-light">&rarr;</span>
                </button>
            </form>



            <!-- Redirect Link to Signup -->
            <div class="mt-6 pt-5 border-t border-gray-100 text-center text-sm">
                <span class="text-gray-500">New visitor?</span>
                <a href="guest-signup.html" class="ml-1 font-semibold text-kpr-teal hover:underline">
                    Create Guest Account
                </a>
            </div>

        </div>
    </main>

    <!-- Footer Security Banner -->
    <div id="footer-container"></div>

    <script src="../../js/config.js"></script>
    <script src="../../js/core/common.js"></script>
    <script src="../../js/auth/guest-login.js"></script>
</body>
</html>
