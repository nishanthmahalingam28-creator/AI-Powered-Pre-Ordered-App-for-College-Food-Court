<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - AI-Powered Food Court</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../js/core/tailwind-config.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/pages/auth.css">
    <script src="../../js/core/public-components.js" defer></script>
</head>
<body class="min-h-screen flex flex-col justify-between font-sans antialiased text-slate-800 relative overflow-x-hidden">

    <!-- HEADER COMPONENT -->
    <div id="navbar-container"></div>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 py-8 lg:py-12 z-10 max-w-7xl mx-auto w-full">
        <!-- Main Heading Title -->
        <h1 class="text-2xl lg:text-4xl font-extrabold text-center text-sky-950 mb-8 lg:mb-12">
            Customer Login - <span class="text-teal-600">Access Your Food Adventure</span>
        </h1>

        <!-- Split Layout: Illustration & Login Form Card -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-16 items-center w-full px-4 lg:px-12">

            <!-- LEFT SIDE: Large Illustration Panel (Visible only on Large Screens) -->
            <div class="lg:col-span-6 flex-col items-center justify-center relative hidden lg:flex">
                <div class="absolute w-96 h-96 bg-teal-200/40 rounded-full blur-3xl -z-10"></div>

                <div class="relative w-full max-w-md flex justify-center items-center">
                    <img src="../../assets/images/character.jpeg" alt="Customer portrait" class="w-full h-auto max-h-[480px] drop-shadow-2xl object-contain transform scale-110 transition-transform duration-300" onerror="this.src='https://placehold.co/400x480/e2eff3/008080?text=Customer+Avatar'">

                    <!-- Floating 'AI Smart Picks' Badge -->
                    <div class="absolute top-4 -right-4 bg-white p-3 rounded-2xl shadow-xl border border-slate-100 flex items-center gap-3 animate-bounce duration-1000 z-20">
                        <div class="bg-teal-50 text-teal-600 p-2 rounded-xl">
                            <i class="fa-solid fa-robot text-xl"></i>
                        </div>
                        <div>
                            <span class="bg-teal-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wide">AI</span>
                            <p class="text-xs font-semibold text-slate-700 mt-0.5">Smart Picks Prepared!</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT SIDE: Login Interactive Card -->
            <div class="lg:col-span-6 w-full max-w-md mx-auto">
                <div class="bg-white/95 backdrop-blur-md rounded-3xl p-6 lg:p-8 shadow-xl shadow-sky-900/5 border border-white flex flex-col gap-6 relative">

                    <!-- Card Top Header with Dedicated Back Button -->
                    <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                        <button onclick="window.history.back()" class="inline-flex items-center gap-2 text-xs font-bold text-slate-500 hover:text-teal-600 bg-slate-100 hover:bg-slate-200/70 px-3.5 py-1.5 rounded-lg transition-all cursor-pointer">
                            <i class="fa-solid fa-arrow-left"></i>
                            <span>Back</span>
                        </button>
                        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Authentication</span>
                    </div>

                    <div>
                        <p class="text-slate-500 text-sm leading-relaxed">
                            Login to manage your profile, live orders, and personalized smart recommendations.
                        </p>
                    </div>

                    <!-- Input Credentials Form -->
                    <form id="loginForm" class="flex flex-col gap-5">
                        <!-- Customer Type Dropdown -->
                        <div>
                            <label for="customerType" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1 pl-1">
                                Customer Type
                            </label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                    <i class="fa-solid fa-user-tag"></i>
                                </div>
                                <select
                                    id="customerType"
                                    class="w-full pl-11 pr-10 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 appearance-none cursor-pointer"
                                >
                                    <option value="student">Student</option>
                                    <option value="faculty">Faculty</option>
                                    <option value="guest">Guest</option>
                                </select>
                                <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-slate-400">
                                    <i class="fa-solid fa-chevron-down text-xs"></i>
                                </div>
                            </div>
                        </div>

                        <!-- Email Input Field -->
                        <div>
                            <label id="emailLabel" for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1 pl-1">
                                Institute Email ID
                            </label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                    <i class="fa-regular fa-envelope"></i>
                                </div>
                                <input
                                    type="email"
                                    id="email"
                                    placeholder="example@kpriet.ac.in"
                                    class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500"
                                >
                            </div>
                            <p id="emailError" class="text-red-500 text-xs mt-1.5 pl-1"></p>
                        </div>

                        <!-- Password Input Field -->
                        <div>
                            <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1 pl-1">
                                Password
                            </label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                    <i class="fa-solid fa-lock"></i>
                                </div>
                                <input
                                    type="password"
                                    id="password"
                                    placeholder="password"
                                    class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500"
                                >
                            </div>
                            <p id="passwordError" class="text-red-500 text-xs mt-1.5 pl-1"></p>
                        </div>

                        <!-- Secondary Settings: Remember Me & Forgot Password -->
                        <div class="flex items-center justify-between text-xs font-medium px-1">
                            <label class="flex items-center gap-2 cursor-pointer text-slate-600">
                                <input type="checkbox" class="rounded text-teal-600 focus:ring-teal-500 border-slate-300 w-4 h-4">
                                Remember Me
                            </label>
                            <a href="forgot-password.html" class="text-sky-700 hover:text-teal-600 hover:underline transition-colors">Forgot Password?</a>
                        </div>

                        <!-- Main Primary Action Button -->
                        <button
                            type="submit"
                            class="w-full bg-teal-700 hover:bg-teal-800 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-teal-700/20 transition-all flex items-center justify-center gap-2 cursor-pointer">
                            <span>Login</span>
                            <i class="fa-solid fa-arrow-right text-sm"></i>
                        </button>
                    </form>


                    <!-- Info/Help Quick Links -->
                    <div class="flex flex-col gap-2 text-xs text-slate-500 font-medium pt-4 px-1 border-t border-slate-100">
                        <div class="flex justify-between items-center">
                            <span>New Student or Guest? <a href="signup.html" class="text-teal-600 hover:underline font-bold">Sign Up Here</a></span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- FOOTER COMPONENT -->
    <div id="footer-container"></div>

    <script src="../../js/config.js"></script>
    <script src="../../js/auth/login.js?v=20260923-authfix2"></script>
</body>
</html>
