<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Sign Up | KPR Food Court</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../js/core/tailwind-config.js"></script>

    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../css/components/common.css">
    <script src="../../js/core/public-components.js" defer></script>
    <link rel="stylesheet" href="../../css/pages/faculty-auth.css">
</head>
<body class="bg-kpr-lightBg min-h-screen flex flex-col justify-between font-sans overflow-x-hidden">

    <!-- Header Branding -->
    <!-- Header Section -->
    <div id="navbar-container"></div>

    <!-- Main Content Container -->
    <main class="flex-grow flex items-center justify-center px-4 sm:px-6 lg:px-8 py-10">
        <div class="max-w-md w-full bg-white rounded-[24px] shadow-xl border border-gray-100 p-8 border-t-[6px] border-t-kpr-facultyBlue">

            <!-- Icon & Page Header -->
            <div class="flex flex-col items-center mb-6">
                <div class="w-16 h-16 bg-[#e6edfa] rounded-full flex items-center justify-center mb-3">
                    <svg class="w-8 h-8 text-kpr-facultyBlue" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                    </svg>
                </div>
                <h2 class="text-2xl font-extrabold text-gray-900 tracking-tight">Create Faculty Account</h2>
                <p class="text-sm text-gray-500 mt-1">Get started with your institutional access</p>
            </div>
            <!-- Registration Form -->
            <form id="signUpForm" class="space-y-4">

                <!-- Full Name Input -->
                <div>
                    <label for="fullName" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Full Name</label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            &#128100;
                        </div>
                        <input type="text" id="fullName" required placeholder="Dr. Jane Doe"
                            class="block w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-kpr-facultyBlue focus:border-kpr-facultyBlue outline-none transition-all text-sm text-gray-900">
                    </div>
                </div>

                <!-- Institutional Email Input -->
                <div>
                    <label for="email" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Institutional Email</label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            &#128231;
                        </div>
                        <input type="email" id="email" required placeholder="jane.doe@kpriet.ac.in"
                            class="block w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-kpr-facultyBlue focus:border-kpr-facultyBlue outline-none transition-all text-sm text-gray-900">
                    </div>
                </div>
                <!-- Faculty ID -->
                <div>
                    <label for="rollNumber" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Faculty / Staff ID</label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            &#127380;
                        </div>
                        <input type="text" id="rollNumber" required placeholder="e.g., EMP1024"
                            class="block w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-kpr-facultyBlue focus:border-kpr-facultyBlue outline-none transition-all text-sm text-gray-900">
                    </div>
                </div>
                <!-- Mobile Number & OTP Verification -->
                <div>
                    <label for="mobileNumber" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Mobile Number</label>
                    <div class="flex gap-2">
                        <div class="relative flex-1 rounded-xl shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                📱
                            </div>
                            <input type="tel" id="mobileNumber" required placeholder="9876543210"
                                class="block w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-kpr-facultyBlue focus:border-kpr-facultyBlue outline-none transition-all text-sm text-gray-900">
                        </div>
                        <button type="button" id="sendOtpBtn" class="bg-kpr-facultyBlue hover:opacity-90 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition-all shrink-0 cursor-pointer">
                            Send OTP
                        </button>
                    </div>
                    <p id="mobileError" class="text-red-500 text-xs mt-1 pl-1"></p>

                    <!-- OTP Input Container -->
                    <div id="otpContainer" class="mt-2.5 hidden">
                        <label for="otpInput" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Enter 6-Digit OTP</label>
                        <div class="flex gap-2">
                            <div class="relative flex-1 rounded-xl shadow-sm">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                    🔑
                                </div>
                                <input type="text" id="otpInput" maxLength="6" placeholder="123456"
                                    class="block w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-kpr-facultyBlue focus:border-kpr-facultyBlue outline-none transition-all text-sm text-gray-900">
                            </div>
                            <button type="button" id="verifyOtpBtn" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition-all shrink-0 cursor-pointer">
                                Verify OTP
                            </button>
                        </div>
                        <p id="otpSuccess" class="text-emerald-600 font-semibold text-xs mt-1 pl-1"></p>
                        <p id="otpError" class="text-red-500 text-xs mt-1 pl-1"></p>
                    </div>
                </div>
                <!-- Password Input -->
                <div>
                    <label for="password" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Password</label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            &#128274;
                        </div>
                        <input type="password" id="password" required placeholder="Minimum 8 characters"
                            class="block w-full pl-10 pr-12 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-kpr-facultyBlue focus:border-kpr-facultyBlue outline-none transition-all text-sm text-gray-900">
                        <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition-colors">
                            &#128065;
                        </button>
                    </div>
                </div>
                <!-- Confirm Password Input -->
                <div>
                    <label for="confirmPassword" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Confirm Password</label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            &#128274;
                        </div>
                        <input type="password" id="confirmPassword" required placeholder="Re-enter your password"
                            class="block w-full pl-10 pr-12 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-kpr-facultyBlue focus:border-kpr-facultyBlue outline-none transition-all text-sm text-gray-900">
                        <button type="button" id="toggleConfirmPassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition-colors">
                            &#128065;
                        </button>
                    </div>

                    <!-- Live validation mismatch helper text -->
                    <p id="passwordMismatchMessage" class="hidden text-xs text-red-500 mt-1 font-medium pl-1">
                        ⚠️ Passwords do not match.
                    </p>
                </div>
                <!-- Terms & Policies -->
                <div class="flex items-start mt-2">
                    <input type="checkbox" id="terms" required class="mt-1 w-4 h-4 text-kpr-facultyBlue border-gray-300 rounded focus:ring-kpr-facultyBlue focus:ring-offset-0 cursor-pointer">
                    <label for="terms" class="ml-2 text-xs font-medium text-gray-500 select-none cursor-pointer leading-normal">
                        I agree to the <a href="#" class="text-kpr-facultyBlue hover:underline font-semibold">Terms of Service</a> and <a href="#" class="text-kpr-facultyBlue hover:underline font-semibold">Privacy Policy</a>.
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-kpr-facultyBlue hover:bg-[#0041a3] text-white font-semibold py-3 px-6 rounded-xl flex items-center justify-center gap-2 transition-all shadow-md mt-4">
                    Sign Up <span class="text-lg font-light">&rarr;</span>
                </button>
            </form>

            <!-- Link back to Login -->
            <div class="mt-6 pt-5 border-t border-gray-100 text-center text-sm">
                <span class="text-gray-500">Already have an account?</span>
                <a href="faculty-login.html" class="ml-1 font-semibold text-kpr-facultyBlue hover:underline">
                    Sign In
                </a>
            </div>

        </div>
    </main>

    <!-- Footer Security Banner -->
    <div id="footer-container"></div>

    <script src="../../js/config.js"></script>
    <script src="../../js/core/common.js"></script>
    <script src="../../js/auth/faculty-signup.js"></script>
</body>
</html>
