<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Analytics & Intelligence | KPR Smart Food Court</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../js/core/tailwind-config.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/base/reset.css">
    <link rel="stylesheet" href="../../css/pages/customer.css">
    <!-- Chart.js for High-Definition Financial Visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/core/public-components.js" defer></script>
    <link rel="stylesheet" href="../../css/pages/customer-workspace.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between font-sans antialiased overflow-x-hidden customer-workspace-page">

<!-- STATIC CUSTOMER WORKSPACE -->
<aside class="customer-workspace-sidebar" aria-label="Customer navigation">
  <div class="customer-workspace-brand"><div class="customer-workspace-brand-mark"><i class="fa-solid fa-utensils"></i></div><div><strong>KPRIET</strong><span>Smart Food Court</span></div></div>
  <nav class="customer-workspace-nav">
    <a href="dashboard.html" data-workspace-link="dashboard.html"><i class="fa-solid fa-table-cells-large"></i><span>Dashboard</span></a>
    <a href="menu.html" data-workspace-link="menu.html"><i class="fa-solid fa-utensils"></i><span>Order Food</span></a>
    <a href="preorder.html" data-workspace-link="preorder.html"><i class="fa-solid fa-basket-shopping"></i><span>My Cart</span></a>
    <a href="orders.html" data-workspace-link="orders.html"><i class="fa-solid fa-receipt"></i><span>My Orders</span></a>
    <a href="morning-survey.html" data-workspace-link="morning-survey.html"><i class="fa-solid fa-sun"></i><span>Morning Survey</span></a>
    <a href="expenses.html" data-workspace-link="expenses.html"><i class="fa-solid fa-wallet"></i><span>Expenses</span></a>
    <a href="budgets.html" data-workspace-link="budgets.html"><i class="fa-solid fa-chart-pie"></i><span>Budgets &amp; Goals</span></a>
    <a href="assistant.html" data-workspace-link="assistant.html"><i class="fa-solid fa-wand-magic-sparkles"></i><span>AI Assistant</span></a>
    <a href="profile.html" data-workspace-link="profile.html"><i class="fa-solid fa-user"></i><span>Profile</span></a>
  </nav>
  <div class="customer-workspace-user"><div class="customer-workspace-avatar" id="sidebar-avatar">S</div><div class="min-w-0"><strong id="sidebar-user-name">Student</strong><span id="sidebar-user-type">Student</span></div>
                    </div>
                </div>

                <!-- Amount -->
                <div>
                    <label for="modal-amount" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Amount (₹)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 font-bold">₹</span>
                        <input
                            type="number"
                            id="modal-amount"
                            name="amount"
                            step="0.01"
                            min="1"
                            max="1000000"
                            required
                            placeholder="0.00"
                            class="w-full pl-8 pr-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-teal-500 focus:bg-white font-bold"
                        >
                    </div>
                </div>

                <!-- Category / Source -->
                <div>
                    <label id="modal-cat-label" for="modal-category" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Category</label>
                    <input
                        type="text"
                        id="modal-category"
                        name="category"
                        required
                        placeholder="e.g. Dining, Snacks, Beverages, Allowance"
                        class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-teal-500 focus:bg-white"
                    >
                </div>

                <!-- Date -->
                <div>
                    <label for="modal-date" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Date</label>
                    <input
                        type="date"
                        id="modal-date"
                        name="date"
                        required
                        class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-teal-500 focus:bg-white"
                    >
                </div>

                <!-- Description -->
                <div>
                    <label for="modal-description" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Description</label>
                    <input
                        type="text"
                        id="modal-description"
                        name="description"
                        required
                        placeholder="e.g. South Indian Thali, Lab Stipend"
                        class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-teal-500 focus:bg-white"
                    >
                </div>

                <div class="pt-2 flex items-center justify-end gap-3">
                    <button
                        type="button"
                        onclick="closeAddTransactionModal()"
                        class="px-4 py-2.5 text-xs font-bold text-slate-600 hover:text-slate-800 transition-colors cursor-pointer"
                    >
                        Cancel
                    </button>
                    <button
                        type="submit"
                        id="modal-submit-btn"
                        class="bg-teal-700 hover:bg-teal-800 text-white font-bold text-xs uppercase tracking-wider px-6 py-2.5 rounded-xl transition-all shadow-md flex items-center gap-2 cursor-pointer"
                    >
                        <span>Save & Sync</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Main Analytics Controller Script -->
    <script src="../../js/customer/analytics.js"></script>
  

  <script src="../../js/customer/customer-workspace.js"></script>
<script src="../../js/customer/customer-workspace-mobile.js"></script>
</body>
</html>
