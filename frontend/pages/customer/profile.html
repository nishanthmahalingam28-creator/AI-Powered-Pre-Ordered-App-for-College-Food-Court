<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - KPR Food Court</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/base/reset.css">
  <link rel="stylesheet" href="../../css/pages/customer.css">
  <script src="../../js/core/public-components.js" defer></script>
    <script src="../../js/customer/customer-workspace.js" defer></script>
    <link rel="stylesheet" href="../../css/pages/customer-workspace.css">
</head>
<body class="customer-page">
  <div id="navbar-container"></div>
  <main class="customer-shell py-8 pb-12">
    <div class="mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <p class="text-sm font-bold uppercase tracking-widest text-teal-700">Customer Account</p>
        <h1 class="mt-2 text-3xl font-black">My Profile</h1>
        <p class="mt-2 text-slate-500">Manage your personal information and account security.</p>
      </div>
      <div class="flex items-center gap-2.5">
        <a href="expenses.html" class="bg-white hover:bg-slate-100 text-slate-700 font-bold text-xs px-4 py-2.5 rounded-xl border border-slate-200 transition-all shadow-sm flex items-center gap-2 w-fit">
          <i class="fa-solid fa-wallet"></i> My Expenses
        </a>
      </div>
    </div>
    <div class="grid gap-6 lg:grid-cols-2">
      <section class="customer-card p-6">
        <h2 class="text-xl font-extrabold text-slate-900">Personal Details</h2>
        <form id="profile-form" class="mt-5 space-y-4">
          <div>
            <label class="block text-sm font-bold text-slate-700" for="profile-name">Full Name</label>
            <input class="customer-input mt-1.5 w-full" id="profile-name" name="name" required placeholder="Loading name...">
          </div>
          <div>
            <label class="block text-sm font-bold text-slate-700" for="profile-email">Email Address <span class="text-xs font-normal text-slate-400">(Read-only)</span></label>
            <input class="customer-input mt-1.5 w-full bg-slate-100 text-slate-600 cursor-not-allowed" id="profile-email" type="email" name="email" readonly placeholder="Loading email...">
          </div>
          <div>
            <label class="block text-sm font-bold text-slate-700" for="profile-mobile">Mobile Number</label>
            <input class="customer-input mt-1.5 w-full" id="profile-mobile" type="tel" name="mobile" placeholder="10-digit mobile number">
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-bold text-slate-700" for="profile-type">Account Type <span class="text-xs font-normal text-slate-400">(Read-only)</span></label>
              <input class="customer-input mt-1.5 w-full bg-slate-100 text-slate-600 cursor-not-allowed uppercase text-xs font-bold" id="profile-type" readonly placeholder="Customer">
            </div>
            <div id="profile-identifier-container">
              <label class="block text-sm font-bold text-slate-700" id="profile-identifier-label" for="profile-identifier">Roll / Staff ID</label>
              <input class="customer-input mt-1.5 w-full bg-slate-100 text-slate-600 cursor-not-allowed font-mono text-xs uppercase" id="profile-identifier" readonly placeholder="N/A">
            </div>
          </div>
          <button id="save-profile-btn" class="customer-button customer-button-primary mt-2" type="submit">Save Changes</button>
          <p id="profile-message" class="hidden rounded-lg p-3 text-xs font-semibold"></p>
        </form>
      </section>

      <section class="customer-card p-6">
        <h2 class="text-xl font-extrabold text-slate-900">Change Password</h2>
        <p class="mt-2 text-sm text-slate-500">Ensure your password has at least 8 characters.</p>
        <form id="password-form" class="mt-5 space-y-4">
          <div>
            <label class="block text-sm font-bold text-slate-700" for="current-password">Current Password</label>
            <input class="customer-input mt-1.5 w-full" id="current-password" type="password" autocomplete="current-password" required placeholder="Enter current password">
          </div>
          <div>
            <label class="block text-sm font-bold text-slate-700" for="new-password">New Password</label>
            <input class="customer-input mt-1.5 w-full" id="new-password" type="password" autocomplete="new-password" required minlength="8" placeholder="Minimum 8 characters">
          </div>
          <div>
            <label class="block text-sm font-bold text-slate-700" for="confirm-password">Confirm New Password</label>
            <input class="customer-input mt-1.5 w-full" id="confirm-password" type="password" autocomplete="new-password" required minlength="8" placeholder="Confirm new password">
          </div>
          <button id="change-password-btn" class="customer-button customer-button-secondary mt-2" type="submit">Update Password</button>
          <p id="password-message" class="hidden rounded-lg p-3 text-xs font-semibold"></p>
        </form>
      </section>
    </div>

    <div class="mt-8 flex justify-end">
      <button id="logout-btn" type="button" class="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 font-bold text-xs px-5 py-3 rounded-xl transition-all flex items-center gap-2 cursor-pointer shadow-sm">
        <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out from Account
      </button>
    </div>
  </main>
  <div id="footer-container"></div>
  <script src="../../js/config.js"></script>
  <script src="../../js/customer/profile.js"></script>
</body>
</html>
