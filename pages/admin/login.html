<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - KPRIET Food Court</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../js/core/tailwind-config.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/pages/admin-login.css">
    <script src="../../js/core/public-components.js" defer></script>
</head>
<body class="min-h-screen flex flex-col justify-between font-sans antialiased text-slate-800">

    <!-- TOP HEADER BAR -->
    <div id="navbar-container"></div>

    <!-- MAIN INTERFACE HOLDER -->
    <main class="flex-grow flex items-center justify-center p-4 z-10 my-6">

        <!-- CARD CONTAINER -->
        <div class="bg-white rounded-[2.5rem] p-8 w-full max-w-[440px] shadow-2xl shadow-indigo-950/5 border border-slate-100 flex flex-col items-center gap-5">

            <!-- CENTRAL AVATAR INFO ICON -->
            <div class="w-32 h-32 bg-[#f7f4ff] rounded-full flex items-center justify-center relative flex-shrink-0">
                <div class="w-20 h-20 rounded-full border-[5px] border-[#5e3ec2] flex items-center justify-center relative">
                    <span class="text-[#5e3ec2] text-4xl font-serif font-black select-none">i</span>
                    <div class="absolute w-4 h-4 bg-[#5e3ec2] bottom-0 left-1 transform rotate-45 rounded-sm"></div>
                </div>
            </div>

            <!-- ADMINISTRATIVE ROLE HEADER -->
            <h1 class="text-[#5e3ec2] text-xl font-black uppercase tracking-wider select-none">
                ADMIN LOGIN
            </h1>

            <!-- RUNTIME AUTHENTICATION ALERTS -->
            <div id="admin-alert-box" class="hidden w-full p-3 rounded-xl text-xs font-semibold flex items-center gap-2"></div>

            <!-- INTERACTIVE FORM FIELDS -->
            <form id="adminLoginForm" class="w-full flex flex-col gap-4">

                <!-- Security ID Input -->
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-user-shield text-sm"></i>
                    </div>
                    <input id="adminUser" type="text" required placeholder="Root Security ID (Username)" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder:text-slate-400 text-sm">
                </div>

                <!-- Master Password Input -->
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-key text-sm"></i>
                    </div>
                    <input id="adminPassword" type="password" required placeholder="Master Passphrase" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder:text-slate-400 text-sm">
                </div>

                <!-- DECORATIVE HORIZONTAL RULE SEPARATOR -->
                <div class="w-full h-[1px] bg-slate-100 my-1"></div>

                <!-- SCOPE PRIVILEGE CHECKLIST DISPLAY -->
                <div class="w-full flex flex-col gap-3 px-1 text-xs opacity-70">
                    <div class="flex items-center gap-3">
                        <div class="w-6 h-6 bg-[#f4effc] rounded-full flex items-center justify-center text-[#5e3ec2] flex-shrink-0">
                            <i class="fa-solid fa-users text-[10px]"></i>
                        </div>
                        <span class="text-slate-700 font-bold">Manage Users Context</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-6 h-6 bg-[#eef5fc] rounded-full flex items-center justify-center text-blue-500 flex-shrink-0">
                            <i class="fa-solid fa-building-user text-[10px]"></i>
                        </div>
                        <span class="text-slate-700 font-bold">Manage Vendors Registry</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-6 h-6 bg-[#fcf0f7] rounded-full flex items-center justify-center text-pink-500 flex-shrink-0">
                            <i class="fa-solid fa-chart-line text-[10px]"></i>
                        </div>
                        <span class="text-slate-700 font-bold">View System Reports</span>
                    </div>
                </div>


                <!-- SUBMIT ACTION BUTTON -->
                <button type="submit" class="w-full mt-2 bg-[#5e3ec2] hover:bg-[#4d32a4] active:scale-[0.99] text-white font-bold py-3.5 px-6 rounded-2xl shadow-xl shadow-[#5e3ec2]/20 transition-all flex items-center justify-center gap-2 text-base tracking-wide">
                    Continue as Admin <i class="fa-solid fa-arrow-right text-sm"></i>
                </button>
            </form>

        </div>
    </main>

    <!-- FOOTER ENVIRONMENT COMPLIANCE BAR -->
    <div id="footer-container"></div>

    <!-- ADMINISTRATIVE AUTHORIZATION PROCESSING SCRIPTS -->
    <script src="../../js/admin/login.js"></script>
</body>
</html>
